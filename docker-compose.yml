version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aquavision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - backend-uploads:/app/backend/uploads
      - backend-outputs:/app/backend/outputs
    networks:
      - aquavision-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aquavision-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - aquavision-net

volumes:
  backend-uploads:
  backend-outputs:

networks:
  aquavision-net:
    driver: bridge
